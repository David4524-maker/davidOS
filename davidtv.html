<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>davidTV v3.1 · La TV de davidOS</title>
<style>
:root{
  --bg:#07090f;--bg-2:#0d1017;--surface:#12151e;--surface-2:#171a24;
  --border:rgba(255,255,255,.08);--border-hi:rgba(255,255,255,.16);
  --text:#e8eaf0;--dim:rgba(232,234,240,.55);--muted:rgba(232,234,240,.35);
  --accent:#0078d4;--accent-2:#4aa3ff;--red:#e81123;--live:#ff2d2d;
  --gold:#ffb800;--green:#27c93f;--purple:#7b2ff7;--yt:#ff0033;
  --radius:10px;--radius-lg:16px;--shadow:0 20px 60px rgba(0,0,0,.6);
}
[data-theme="light"]{--bg:#e8eaf0;--bg-2:#f2f4f8;--surface:#fff;--surface-2:#f7f8fa;
  --text:#0d1017;--dim:rgba(13,16,23,.6);--muted:rgba(13,16,23,.35);--border:rgba(0,0,0,.08);--border-hi:rgba(0,0,0,.18);}
[data-theme="sunset"]{--accent:#f97316;--accent-2:#fbbf24;}
[data-theme="ocean"]{--accent:#0ea5e9;--accent-2:#22d3ee;}
[data-theme="forest"]{--accent:#27c93f;--accent-2:#4ade80;}
[data-theme="purple"]{--accent:#7b2ff7;--accent-2:#b44aff;}
[data-theme="yt"]{--accent:#ff0033;--accent-2:#ff5566;}

*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);
  user-select:none;-webkit-font-smoothing:antialiased;font-size:14px;}
button{font-family:inherit;color:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;color:inherit;outline:none;}

#app{display:grid;grid-template-rows:52px 1fr 64px;width:100%;height:100%;
  background:radial-gradient(1200px 800px at 10% 0%,#1a1f35 0%,transparent 55%),
    radial-gradient(900px 700px at 90% 100%,#2a1040 0%,transparent 55%),
    linear-gradient(135deg,var(--bg),var(--bg-2));}

.topbar{display:flex;align-items:center;gap:14px;padding:0 16px;
  background:rgba(10,12,20,.85);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);z-index:50;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.3px;}
.brand .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 12px rgba(0,120,212,.4);}
.brand .sub{font-size:10px;color:var(--dim);font-weight:400;letter-spacing:1px;text-transform:uppercase;}
.topbar-search{flex:1;max-width:420px;margin-left:20px;position:relative;}
.topbar-search input{width:100%;padding:8px 12px 8px 34px;border-radius:20px;border:1px solid var(--border);
  background:rgba(255,255,255,.04);font-size:13px;}
.topbar-search input:focus{border-color:var(--accent);background:rgba(0,120,212,.08);}
.topbar-search::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);}
.topbar-stat{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:16px;background:rgba(255,255,255,.04);}
.topbar-stat b{color:var(--text);font-weight:600;}
.topbar-btn{width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:var(--text);
  display:flex;align-items:center;justify-content:center;font-size:15px;transition:background .15s;}
.topbar-btn:hover{background:rgba(255,255,255,.08);}
.clock-live{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;padding:4px 10px;border-radius:6px;}
.clock-live .t{font-size:14px;font-weight:600;}
.clock-live .d{font-size:10px;color:var(--dim);}

.body{display:grid;grid-template-columns:280px 1fr;overflow:hidden;}
.body.full-mode{grid-template-columns:1fr;}
.body.full-mode .sidebar{display:none;}
.sidebar{background:rgba(10,12,20,.7);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sb-section{padding:12px 14px 8px;}
.sb-title{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:8px;}
.cat-list{display:flex;flex-direction:column;gap:2px;}
.cat{padding:8px 10px;border-radius:7px;display:flex;align-items:center;gap:9px;cursor:pointer;
  font-size:12.5px;color:var(--dim);transition:background .12s,color .12s;}
.cat:hover{background:rgba(255,255,255,.05);color:var(--text);}
.cat.on{background:linear-gradient(90deg,rgba(0,120,212,.28),rgba(0,120,212,.05));
  color:var(--text);font-weight:600;border-left:3px solid var(--accent);padding-left:7px;}
.cat .g{font-size:15px;line-height:1;}
.cat .count{margin-left:auto;font-size:10.5px;color:var(--muted);background:rgba(255,255,255,.06);
  padding:1px 6px;border-radius:8px;}
.cat.on .count{background:rgba(0,120,212,.35);color:#fff;}

.ch-list-wrap{flex:1;overflow-y:auto;padding:4px 8px 12px;}
.ch-list-wrap::-webkit-scrollbar{width:6px;}
.ch-list-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px;}
.ch-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;
  cursor:pointer;transition:background .12s;position:relative;}
.ch-item:hover{background:rgba(255,255,255,.05);}
.ch-item.on{background:linear-gradient(90deg,rgba(0,120,212,.3),rgba(0,120,212,.06));}
.ch-item.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;
  background:var(--accent);border-radius:0 3px 3px 0;}
.ch-num{font-size:11px;font-weight:700;color:var(--dim);min-width:22px;text-align:center;
  font-family:ui-monospace,monospace;background:rgba(255,255,255,.05);border-radius:4px;padding:2px 0;}
.ch-ico{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;}
.ch-info{flex:1;overflow:hidden;min-width:0;}
.ch-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ch-prog{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.ch-fav{color:var(--gold);font-size:13px;opacity:0;transition:opacity .15s;cursor:pointer;}
.ch-item:hover .ch-fav,.ch-item.fav .ch-fav{opacity:1;}

.main{display:flex;flex-direction:column;overflow:hidden;background:#000;position:relative;}
.view-pane{display:none;flex:1;overflow:hidden;flex-direction:column;}
.view-pane.active{display:flex;}

.screen-wrap{position:relative;flex:1;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.screen{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:#000;overflow:hidden;}
.screen-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:background .4s;}
.screen-bg{position:absolute;inset:0;background:var(--ch-color,#1a1a2e);opacity:.85;}
.screen-bg::after{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.08) 0%,transparent 60%),
    radial-gradient(circle at 70% 70%,rgba(0,0,0,.4) 0%,transparent 60%);}
.screen-content{position:relative;z-index:2;text-align:center;padding:20px;max-width:80%;}
.screen-emoji{font-size:96px;line-height:1;margin-bottom:14px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6));}
.screen-channel{font-size:14px;color:rgba(255,255,255,.7);letter-spacing:3px;text-transform:uppercase;font-weight:600;}
.screen-prog{font-size:28px;font-weight:700;color:#fff;margin:8px 0;text-shadow:0 4px 20px rgba(0,0,0,.7);}
.screen-desc{font-size:13px;color:rgba(255,255,255,.65);max-width:560px;margin:0 auto;}
.live-ind{position:absolute;top:14px;left:14px;z-index:5;display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.55);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.5px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulseL 1.4s infinite;}
@keyframes pulseL{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,45,45,.7);}50%{opacity:.7;box-shadow:0 0 0 8px rgba(255,45,45,0);}}
.screen-wm{position:absolute;top:14px;right:14px;z-index:5;font-size:11px;font-weight:700;
  color:rgba(255,255,255,.7);background:rgba(0,0,0,.55);padding:4px 10px;border-radius:6px;font-family:ui-monospace,monospace;}
.screen-q{position:absolute;top:14px;right:80px;z-index:5;font-size:10px;font-weight:800;
  color:#fff;background:var(--accent);padding:3px 7px;border-radius:4px;letter-spacing:.5px;}
.screen-ticker{position:absolute;left:0;right:0;bottom:0;z-index:5;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.85));padding:24px 0 8px;overflow:hidden;}
.ticker-track{display:flex;gap:40px;white-space:nowrap;animation:tick 40s linear infinite;font-size:12px;
  color:rgba(255,255,255,.85);padding-left:100%;}
@keyframes tick{from{transform:translateX(0);}to{transform:translateX(-100%);}}
.ticker-track span b{color:var(--accent-2);}
.info-ov{position:absolute;left:0;right:0;bottom:0;z-index:6;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.92));
  padding:60px 24px 24px;display:flex;gap:20px;align-items:flex-end;
  transform:translateY(100%);transition:transform .28s;pointer-events:none;}
.info-ov.on{transform:translateY(0);pointer-events:auto;}
.info-ov-ico{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;}
.info-ov-num{font-family:ui-monospace,monospace;font-size:26px;font-weight:800;color:var(--accent-2);}
.info-ov-name{font-size:18px;font-weight:700;}
.info-ov-cat{font-size:11px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:1px;}
.info-ov-now{margin-top:8px;font-size:13px;color:rgba(255,255,255,.85);}
.info-ov-next{font-size:12px;color:rgba(255,255,255,.5);margin-top:3px;}
.info-ov-prog{height:3px;border-radius:2px;background:rgba(255,255,255,.15);margin-top:8px;overflow:hidden;max-width:340px;}
.info-ov-prog>div{height:100%;background:var(--accent);}

/* ===== YOUTUBE ===== */
.yt-layout{display:grid;grid-template-columns:220px 1fr;height:100%;overflow:hidden;}
.yt-side{background:rgba(10,12,20,.6);border-right:1px solid var(--border);overflow-y:auto;padding:14px 8px;}
.yt-logo{display:flex;align-items:center;gap:6px;padding:0 10px 14px;font-size:17px;font-weight:800;letter-spacing:-.5px;}
.yt-logo .ico{color:var(--yt);}
.yt-logo small{font-size:9px;background:var(--yt);color:#fff;padding:1px 4px;border-radius:3px;font-weight:700;margin-left:2px;}
.yt-item{padding:9px 12px;border-radius:8px;display:flex;align-items:center;gap:12px;
  cursor:pointer;font-size:13px;color:var(--dim);transition:background .12s,color .12s;}
.yt-item:hover{background:rgba(255,255,255,.06);color:var(--text);}
.yt-item.on{background:rgba(255,255,255,.1);color:var(--text);font-weight:600;}
.yt-item .g{font-size:16px;width:20px;text-align:center;}
.yt-sep{height:1px;background:var(--border);margin:10px 6px;}
.yt-title-sm{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;padding:8px 12px 4px;}
.yt-subs{display:flex;flex-direction:column;}
.yt-sub{padding:7px 12px;border-radius:8px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:12.5px;color:var(--dim);}
.yt-sub:hover{background:rgba(255,255,255,.05);color:var(--text);}
.yt-sub .av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}

.yt-main{overflow-y:auto;padding:14px 22px 30px;}
.yt-main::-webkit-scrollbar{width:8px;}
.yt-main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px;}
.yt-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:linear-gradient(180deg,var(--bg),rgba(7,9,15,.9) 70%,transparent);z-index:5;padding-top:4px;}
.yt-chips::-webkit-scrollbar{height:0;}
.yt-chip{padding:7px 14px;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,.06);
  font-size:12px;white-space:nowrap;transition:background .12s;}
.yt-chip:hover{background:rgba(255,255,255,.12);}
.yt-chip.on{background:#fff;color:#000;border-color:#fff;font-weight:600;}
.yt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px 16px;}
.yt-card{cursor:pointer;transition:transform .15s;}
.yt-card:hover{transform:translateY(-3px);}
.yt-thumb{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:60px;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.yt-thumb::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.15),transparent 60%);}
.yt-dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.85);color:#fff;
  padding:2px 6px;border-radius:4px;font-size:11px;font-weight:700;z-index:2;}
.yt-live-b{position:absolute;top:8px;left:8px;background:var(--live);color:#fff;
  padding:2px 8px;border-radius:4px;font-size:10px;font-weight:800;letter-spacing:.5px;z-index:2;}
.yt-meta{display:flex;gap:10px;margin-top:10px;}
.yt-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:#fff;flex-shrink:0;}
.yt-txt{flex:1;min-width:0;}
.yt-title{font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.yt-sub-t{font-size:12px;color:var(--dim);margin-top:4px;}
.yt-stats{font-size:11.5px;color:var(--muted);margin-top:2px;}

/* ===== STORE ===== */
.store-wrap{flex:1;overflow-y:auto;padding:0 22px 30px;}
.store-wrap::-webkit-scrollbar{width:8px;}
.store-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px;}
.store-head{padding:18px 0 14px;position:sticky;top:0;background:linear-gradient(180deg,var(--bg),rgba(7,9,15,.9) 70%,transparent);z-index:5;}
.store-title{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.store-title h1{font-size:24px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:10px;}
.store-title .logo{width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,#22d3ee,#7b2ff7);display:flex;align-items:center;justify-content:center;font-size:18px;}
.store-search{flex:1;max-width:400px;margin-left:auto;position:relative;}
.store-search input{width:100%;padding:9px 14px 9px 36px;border-radius:20px;border:1px solid var(--border);
  background:rgba(255,255,255,.04);font-size:13px;}
.store-search input:focus{border-color:var(--accent);}
.store-search::before{content:'🔍';position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5;font-size:13px;}
.store-cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
.store-cats::-webkit-scrollbar{height:0;}
.store-cat{padding:7px 14px;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,.05);
  font-size:12.5px;white-space:nowrap;transition:all .12s;display:flex;align-items:center;gap:6px;}
.store-cat:hover{background:rgba(255,255,255,.12);}
.store-cat.on{background:var(--accent);color:#fff;border-color:transparent;font-weight:600;}

.store-featured{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin-bottom:26px;}
.store-banner{position:relative;border-radius:16px;overflow:hidden;padding:24px;
  display:flex;flex-direction:column;justify-content:flex-end;min-height:180px;cursor:pointer;
  box-shadow:0 12px 30px rgba(0,0,0,.4);transition:transform .15s;}
.store-banner:hover{transform:translateY(-3px);}
.store-banner .tag{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.6);color:#fff;
  padding:3px 10px;border-radius:10px;font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.store-banner h3{font-size:20px;font-weight:800;margin-bottom:4px;color:#fff;}
.store-banner p{font-size:12.5px;opacity:.85;color:#fff;}
.store-banner .ic{position:absolute;top:16px;right:16px;font-size:56px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));}

.store-section-h{font-size:16px;font-weight:700;margin:22px 0 12px;display:flex;align-items:center;gap:8px;}
.store-section-h small{color:var(--muted);font-weight:400;font-size:12px;}
.store-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.store-card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:14px;
  padding:14px;display:flex;gap:12px;cursor:pointer;transition:all .15s;}
.store-card:hover{background:rgba(255,255,255,.06);border-color:var(--border-hi);transform:translateY(-2px);}
.store-card .icon{width:54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:26px;flex-shrink:0;box-shadow:0 6px 16px rgba(0,0,0,.4);}
.store-card .info{flex:1;min-width:0;}
.store-card .n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.store-card .s{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.store-card .r{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--dim);margin-top:5px;}
.store-card .r b{color:var(--gold);}
.store-card .install{margin-top:8px;padding:6px 12px;border-radius:8px;border:1px solid var(--accent);
  background:transparent;color:var(--accent-2);font-size:11.5px;font-weight:600;width:100%;transition:all .12s;}
.store-card .install:hover{background:var(--accent);color:#fff;border-color:transparent;}
.store-card .install.installed{background:rgba(39,201,63,.15);border-color:rgba(39,201,63,.5);color:#4ade80;}
.store-card .install.installed:hover{background:var(--red);color:#fff;border-color:transparent;}
.store-card .cat-tag{display:inline-block;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.06);
  font-size:10px;color:var(--dim);margin-left:6px;}

/* Remote */
.remote{background:linear-gradient(180deg,var(--surface),var(--surface-2));border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;padding:14px;width:320px;}
.remote-title{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);
  font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.remote-title button{font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid var(--border);
  background:transparent;color:var(--dim);}
.remote-body{background:linear-gradient(180deg,#1a1d28,#0d1017);border-radius:20px;padding:16px;
  border:1px solid var(--border);box-shadow:0 20px 40px rgba(0,0,0,.5);}
.dpad{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;gap:6px;
  width:180px;margin:0 auto 14px;}
.dpad button{aspect-ratio:1;border-radius:14px;border:1px solid var(--border-hi);
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.2));
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text);
  transition:transform .08s,background .12s;}
.dpad button:hover{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.25));}
.dpad button:active{transform:scale(.92);}
.dpad .ok{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;font-weight:700;font-size:12px;
  box-shadow:0 4px 14px rgba(0,120,212,.5);border-color:transparent;}
.dpad .empty{background:transparent;border-color:transparent;cursor:default;}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 auto 14px;width:180px;}
.numpad button{aspect-ratio:1.4;border-radius:10px;border:1px solid var(--border);
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.15));
  font-size:16px;font-weight:700;font-family:ui-monospace,monospace;color:var(--text);}
.numpad button:hover{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.2));}
.numpad button:active{transform:scale(.94);}

.ach-card .t{font-size:12px;font-weight:600;}
.ach-card .d{font-size:10.5px;color:var(--dim);margin-top:2px;}

#notifs{position:fixed;top:16px;right:16px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}

#app.fullscreen .sidebar,#app.fullscreen .topbar,#app.fullscreen .bottombar{display:none;}

::-webkit-scrollbar{width:10px;height:10px;}

  function beep(freq, dur) {
    try {
      const ctx = window._tvActx || (window._tvActx = new (window.AudioContext||window.webkitAudioContext)());
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = freq; o.type = 'sine';
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.04, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
      o.start(); o.stop(ctx.currentTime + dur);
    } catch(e){}
  }

  /* ---------- SIDEBAR ---------- */

  function renderChannels() {
    const host = $('#chList');
    if (!host) return;
    let list = CHANNELS.slice();
    if (state.category !== 'Todos') list = list.filter(c => c.cat === state.category);
    if (state.filter === 'fav') list = list.filter(c => state.favorites.includes(c.n));
    if (state.filter === 'recent') list = state.recents.map(n => getChannel(n)).filter(Boolean);
    if (state.sort === 'name') list.sort((a,b)=>a.name.localeCompare(b.name));
    else if (state.sort === 'cat') list.sort((a,b)=>a.cat.localeCompare(b.cat)||a.n-b.n);
    else list.sort((a,b)=>a.n-b.n);

    setText('chListTitle', `Canales (${list.length})`);

    if (!list.length) {
      host.innerHTML = '<div style="padding:20px;text-align:center;color:var(--dim);font-size:12px;">Sin canales</div>';
      return;
    }

    host.innerHTML = list.map(ch => `
      <div class="ch-item ${state.current===ch.n?'on':''} ${state.favorites.includes(ch.n)?'fav':''}"

  /* ---------- TUNE ---------- */
  function tune(n) {
    const ch = getChannel(n);
    if (!ch) { notify('Canal no encontrado: ' + n, 'error'); return; }
    if (state.kidsMode && ch.cat !== 'Infantil' && ch.cat !== 'Documentales') {
      notify('🔒 Modo infantil: canal bloqueado', 'warn');
      return;
    }
    if (state.view !== 'tv') switchTab('tv', $('.bb-tab[data-tab="tv"]'));

    state.current = n;
    state.recents = [n, ...state.recents.filter(x => x !== n)].slice(0,20);
    state.watchSeconds += Math.round((Date.now() - state.watchStart) / 1000);
    state.watchStart = Date.now();
    saveState();
    renderScreen();
    renderChannels();
    if (state.pip) renderPip();
    updateRemoteNow();

    const seen = JSON.parse(localStorage.getItem('tv.seen')||'[]');
    if (!seen.includes(n)) { seen.push(n); localStorage.setItem('tv.seen', JSON.stringify(seen)); }
    if (seen.length >= 90) unlockAch('all');
    if (seen.length >= 10) unlockAch('ten');
    unlockAch('first');
    if (ch.cat === 'Noticias') unlockAch('news');
    if (ch.cat === 'Infantil') unlockAch('kids');
    if (ch.cat === 'Premium') unlockAch('premium');

    if ($('#infoOv')?.classList.contains('on')) showInfo();
    beep(660, 0.03);
  }

  function sortedChannels() {
    let list = CHANNELS.slice();
    if (state.kidsMode) list = list.filter(c => c.cat === 'Infantil' || c.cat === 'Documentales');
    return list;
  }
  function nextChannel() {
    const list = sortedChannels();
    const i = list.findIndex(c => c.n === state.current);
    if (i < 0) { tune(list[0].n); return; }
    tune(list[(i+1) % list.length].n);
  }
  function prevChannel() {
    const list = sortedChannels();
    const i = list.findIndex(c => c.n === state.current);
    if (i < 0) { tune(list[0].n); return; }
    tune(list[(i-1+list.length) % list.length].n);
  }
  function setCat(cat) { state.category = cat; renderCategories(); renderChannels(); }
  function toggleFav(n) {
    const i = state.favorites.indexOf(n);
    if (i >= 0) state.favorites.splice(i, 1);
    else { state.favorites.push(n); unlockAch('fav'); }
    saveState(); renderChannels(); updateRemoteNow();
  }

  /* ---------- VOLUME (BUG FIX: null-safe) ---------- */

    const volEl = $('#volVal');

    updateRemoteNow();

  let numBuffer = '';
  let numTimer = null;
  function typeNumber(k) {
    if (k === 'back') numBuffer = numBuffer.slice(0, -1);
    else if (k === 'go') {
      if (numBuffer) { tune(parseInt(numBuffer)); numBuffer = ''; updateRemoteNow(); }
      return;
    } else numBuffer += k;

    clearTimeout(numTimer);
    numTimer = setTimeout(() => {
      if (numBuffer) { tune(parseInt(numBuffer)); numBuffer = ''; updateRemoteNow(); }
    }, 1200);

    const ch = $('#rmCh');
    if (ch) ch.textContent = numBuffer ? `_${numBuffer}` : (currentChannel()?.n || '—');
  }

    state.recording = !state.recording;
    if (state.recording) {
      state.recStart = Date.now();
      notify(`⏺️ Grabando: ${currentChannel().now}`, 'rec');
      unlockAch('rec');
    } else {
      const dur = Math.round((Date.now() - state.recStart) / 1000);
      state.recordings.unshift({
        n: state.current, name: currentChannel().name,
        prog: currentChannel().now, dur, at: Date.now()
      });
      saveState();
      notify(`⏹️ Grabación guardada (${fmtDur(dur)})`, 'success');
    }
    updateRemoteNow();
  }

  function fmtDur(s) {
    const m = Math.floor(s/60), sec = s%60;
    return `${m}m ${sec}s`;
  }

  function setTheme(t) {
    state.theme = t;
    document.documentElement.setAttribute('data-theme', t);
    saveState();
    closeModal('mdSet');
    openSettings();
  }
  function toggleTheme() {
    const themes = ['default','purple','sunset','ocean','forest','yt'];
    const i = themes.indexOf(state.theme);
    setTheme(themes[(i+1) % themes.length]);
    notify('Tema: ' + state.theme);
  }
  function toggleSetting(key, el) {
    state[key] = !state[key];
    if (el) el.classList.toggle('on', state[key]);
    if (key === 'ambilight' || key === 'cinemaMode' || key === 'nightMode') renderScreen();
    saveState();
    notify(`${key}: ${state[key]?'ON':'OFF'}`);
  }
  function toggleKids(el) {
    state.kidsMode = !state.kidsMode;
    if (el) el.classList.toggle('on', state.kidsMode);
    if (state.kidsMode && !['Infantil','Documentales'].includes(currentChannel()?.cat)) tune(37);
    renderChannels();
    notify(state.kidsMode ? '🧸 Modo infantil activado' : 'Modo infantil desactivado');
    saveState();
  }
  function changePin() {
    const newPin = prompt('Nuevo PIN (4 dígitos):', state.pin);
    if (newPin && /^\d{4}$/.test(newPin)) { state.pin = newPin; saveState(); notify('🔒 PIN actualizado', 'success'); }
    else if (newPin) notify('PIN inválido', 'error');
  }
  function setSleep(min) {
    clearTimeout(state.sleepTimer);
    if (+min > 0) {
      state.sleepTimer = setTimeout(() => {
        notify('🌙 Apagando davidTV por temporizador', 'warn');
      }, +min * 60000);
      notify(`⏰ Apagado en ${min} min`);
    }
  }

    state.profile = p;
    setText('profileName', p);
    saveState();
    notify('Perfil: ' + p);
  }
  function resetAll() {
    if (!confirm('¿Borrar todos los datos de davidTV?')) return;
    ['tv.fav','tv.recents','tv.recs','tv.ach','tv.seen','tv.sessions','tv.installed'].forEach(k => localStorage.removeItem(k));
    location.reload();
  }

  /* ---------- TABS ---------- */
  function switchTab(tab, el) {
    // Actualizar botones
    $$('.bb-tab').forEach(t => t.classList.remove('on'));
    if (el) el.classList.add('on');

    if (tab === 'youtube') { unlockAch('youtube'); showView('youtube'); renderYouTube(); return; }
    if (tab === 'store') { unlockAch('store'); showView('store'); renderStore(); return; }
    if (tab === 'tv') { showView('tv'); return; }

    // El resto son modales
    showView('tv');
    switch (tab) {
      case 'fav': openFavs(); break;
      case 'rec': openRecs(); break;
      case 'epg': openEpg(); break;
      case 'trend': openTrending(); break;
      case 'ach': openAchievements(); break;
      case 'stats': openStats(); break;
    }
  }

  function showView(v) {
    state.view = v;
    $$('.view-pane').forEach(p => p.classList.remove('active'));
    const pane = document.getElementById('view-' + v);
    if (pane) pane.classList.add('active');
    const body = $('#body');
    if (body) body.classList.toggle('full-mode', v === 'youtube' || v === 'store');
    // Actualizar el botón del tab activo
    const btn = $(`.bb-tab[data-tab="${v}"]`);
    if (btn) { $$('.bb-tab').forEach(t => t.classList.remove('on')); btn.classList.add('on'); }
  }

                <span class="chip-mini"><b>${esc(v.ch)}</b></span>
                <span class="chip-mini">${esc(v.views)}</span>
                <span class="chip-mini">${esc(v.ago)}</span>
                <span class="chip-mini">${v.live?'🔴 EN VIVO':'⏱ '+v.dur}</span>
                <span class="chip-mini">📁 ${esc(v.cat)}</span>
              </div>
              <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">
                <button class="bb-btn" onclick="TV.notify('👍 Me gusta')">👍 Me gusta</button>
                <button class="bb-btn" onclick="TV.notify('🔗 Enlace copiado')">🔗 Compartir</button>
                <button class="bb-btn" onclick="TV.notify('⬇️ Descargando vídeo...')">⬇️ Descargar</button>
                <button class="bb-btn" onclick="TV.notify('🔔 Suscrito a '+${JSON.stringify(v.ch)})">🔔 Suscribirse</button>
                <button class="bb-btn primary" onclick="TV.closeModal('mdYt');TV.notify('📺 Reproduciendo en pantalla completa')">⛶ Pantalla completa</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
  }

  /* ---------- STORE RENDER ---------- */
  function renderStore() {
    renderStoreCats();
    renderStoreFeatured();
    renderStoreGrid();
  }

  function renderStoreCats() {
    const host = $('#storeCats');
    if (!host) return;
    host.innerHTML = STORE_CATS.map(c => `
      <div class="store-cat ${state.storeCat===c?'on':''}" onclick="TV.setStoreCat('${c}')">
        ${storeCatIcon(c)} ${esc(c)}
      </div>
    `).join('');
  }
  function storeCatIcon(c) {
    return {'Todas':'🧩','Streaming':'📺','Deportes':'⚽','Música':'🎵','Gaming':'🎮','Anime':'🎌','Infantil':'🧒','Utilidades':'🔧','Juegos':'🎲'}[c] || '📦';
  }

  function renderStoreFeatured() {
    const host = $('#storeFeatured');
    if (!host) return;
    const feat = STORE_APPS.filter(a => a.featured).slice(0, 3);
    host.innerHTML = feat.map((a, i) => `
      <div class="store-banner" style="background:linear-gradient(135deg,${a.color},${a.color}cc);" onclick="TV.openStoreApp('${a.id}')">
        <span class="tag">${i===0?'⭐ Destacada':'Recomendada'}</span>
        <span class="ic">${a.icon}</span>
        <h3>${esc(a.name)}</h3>
        <p>${esc(a.desc)}</p>
        <div style="margin-top:10px;display:flex;gap:6px;align-items:center;">
          <span class="chip-mini" style="background:rgba(0,0,0,.4);color:#fff;"><b style="color:#fff;">⭐ ${a.rating}</b></span>
          <span class="chip-mini" style="background:rgba(0,0,0,.4);color:#fff;">${esc(a.installs)}</span>
        </div>
      </div>
    `).join('');
  }

  function renderStoreGrid() {
    const host = $('#storeGrid');
    if (!host) return;
    let list = STORE_APPS.slice();
    if (state.storeCat !== 'Todas') list = list.filter(a => a.cat === state.storeCat);
    if (state.storeSearch) {
      const q = state.storeSearch.toLowerCase();
      list = list.filter(a => a.name.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q) || a.cat.toLowerCase().includes(q));
    }
    setText('storeCount', `${list.length} apps`);
    if (!list.length) {
      host.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--dim);">Sin resultados.</div>';
      return;
    }
    host.innerHTML = list.map(a => {
      const installed = state.installed.includes(a.id);
      return `
        <div class="store-card" onclick="TV.openStoreApp('${a.id}')">
          <div class="icon" style="background:${a.color};">${a.icon}</div>
          <div class="info">
            <div class="n">${esc(a.name)}<span class="cat-tag">${esc(a.cat)}</span></div>
            <div class="s">${esc(a.desc)}</div>
            <div class="r"><b>⭐ ${a.rating}</b> · ${esc(a.installs)} · ${esc(a.size)}</div>
            <button class="install ${installed?'installed':''}" onclick="event.stopPropagation();TV.toggleInstall('${a.id}',this)">${installed?'Instalada ✓':'Instalar'}</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function setStoreCat(c) { state.storeCat = c; renderStoreCats(); renderStoreGrid(); }

  function toggleInstall(id, el) {
    const i = state.installed.indexOf(id);
    const app = STORE_APPS.find(a => a.id === id);
    if (i >= 0) {
      state.installed.splice(i, 1);
      if (el) { el.classList.remove('installed'); el.textContent = 'Instalar'; }
      notify(`🗑️ ${app.name} desinstalada`);
    } else {
      state.installed.push(id);
      if (el) { el.classList.add('installed'); el.textContent = 'Instalada ✓'; }
      notify(`📦 ${app.name} instalada`, 'success');
      unlockAch('install');
    }
    saveState();
  }

  function openStoreApp(id) {
    const app = STORE_APPS.find(a => a.id === id);
    if (!app) return;
    const installed = state.installed.includes(app.id);
    const html = `
      <div class="modal-bd on" id="mdStore" onclick="if(event.target===this)TV.closeModal('mdStore')">
        <div class="modal sm">
          <div class="modal-head">
            <h2>🛒 ${esc(app.name)}</h2>
            <button class="modal-close" onclick="TV.closeModal('mdStore')">✕</button>
          </div>
          <div class="modal-body">
            <div style="display:flex;gap:16px;align-items:center;margin-bottom:18px;">
              <div class="icon" style="width:80px;height:80px;border-radius:18px;background:${app.color};display:flex;align-items:center;justify-content:center;font-size:42px;">${app.icon}</div>
              <div>
                <div style="font-size:20px;font-weight:700;">${esc(app.name)}</div>
                <div style="color:var(--dim);font-size:13px;margin-top:4px;">${esc(app.cat)} · ${esc(app.size)}</div>
                <div style="color:var(--gold);font-size:13px;margin-top:6px;font-weight:600;">⭐ ${app.rating} · ${esc(app.installs)}</div>
              </div>
            </div>
            <div style="font-size:13px;color:var(--dim);line-height:1.6;">${esc(app.desc)}</div>
            <div style="display:flex;gap:8px;margin-top:20px;">
              <button class="bb-btn ${installed?'':'primary'}" style="flex:1;" onclick="TV.toggleInstall('${app.id}');TV.closeModal('mdStore')">
                ${installed?'🗑️ Desinstalar':'📦 Instalar'}
              </button>
              ${installed?`<button class="bb-btn primary" style="flex:1;" onclick="TV.closeModal('mdStore');TV.notify('▶️ Abriendo ${esc(app.name)}...')">▶️ Abrir</button>`:''}
            </div>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
  }

  /* ---------- TRENDING ---------- */
  function openTrending() {
    const trend = [...CHANNELS].sort(() => Math.random() - .5).slice(0, 12);
    const html = `
      <div class="modal-bd on" id="mdTrend" onclick="if(event.target===this)TV.closeModal('mdTrend')">
        <div class="modal">
          <div class="modal-head">
            <h2>🔥 Tendencias ahora</h2>
            <button class="modal-close" onclick="TV.closeModal('mdTrend')">✕</button>
          </div>
          <div class="modal-body">
            <div class="fav-grid">${trend.map((ch, i) => `
              <div class="fav-card" onclick="TV.tune(${ch.n});TV.closeModal('mdTrend')">
                <div style="position:absolute;top:6px;left:6px;background:rgba(0,0,0,.7);padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;">#${i+1}</div>
                <div class="ic" style="background:${ch.color};">${ch.icon}</div>

          </div>
        </div>
      </div>
    `;

  /* ---------- ACHIEVEMENTS ---------- */
  function openAchievements() {
    const html = `
      <div class="modal-bd on" id="mdAch" onclick="if(event.target===this)TV.closeModal('mdAch')">
        <div class="modal">
          <div class="modal-head">
            <h2>🏆 Logros (${state.achievements.length}/${ACHIEVEMENTS.length})</h2>
            <button class="modal-close" onclick="TV.closeModal('mdAch')">✕</button>
          </div>
          <div class="modal-body">
            <div class="ach-grid">
              ${ACHIEVEMENTS.map(a => {
                const on = state.achievements.includes(a.id);
                return `<div class="ach-card ${on?'unlocked':'locked'}">
                  <div class="g">${a.g}</div>
                  <div class="t">${esc(a.t)}</div>
                  <div class="d">${esc(a.d)}</div>
                </div>`;
              }).join('')}
            </div>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
  }

  /* ---------- STATS ---------- */
  function openStats() {
    const seen = JSON.parse(localStorage.getItem('tv.seen')||'[]');
    const watchTotal = Math.round((state.watchSeconds + (Date.now() - state.watchStart) / 1000) / 60);
    const html = `
      <div class="modal-bd on" id="mdStats" onclick="if(event.target===this)TV.closeModal('mdStats')">
        <div class="modal">
          <div class="modal-head">
            <h2>📊 Estadísticas de davidTV</h2>
            <button class="modal-close" onclick="TV.closeModal('mdStats')">✕</button>
          </div>
          <div class="modal-body">
            <div class="set-group">
              <div class="set-row"><span class="label">Tiempo visto</span><b>${watchTotal} min</b></div>
              <div class="set-row"><span class="label">Canales vistos</span><b>${seen.length} / 90</b></div>
              <div class="set-row"><span class="label">Favoritos</span><b>${state.favorites.length}</b></div>
              <div class="set-row"><span class="label">Grabaciones</span><b>${state.recordings.length}</b></div>
              <div class="set-row"><span class="label">Apps instaladas</span><b>${state.installed.length} / ${STORE_APPS.length}</b></div>
              <div class="set-row"><span class="label">Logros</span><b>${state.achievements.length} / ${ACHIEVEMENTS.length}</b></div>
              <div class="set-row"><span class="label">Perfil</span><b>${esc(state.profile)}</b></div>
            </div>
            <div class="set-group">
              <h3>Canales por categoría</h3>
              ${CATEGORIES.filter(c=>c.id!=='Todos').map(cat => {
                const n = CHANNELS.filter(c => c.cat === cat.id).length;
                return `<div class="set-row"><span class="label">${cat.icon} ${esc(cat.id)}</span><b>${n}</b></div>`;
              }).join('')}
            </div>

      </div>

  /* ---------- HELP ---------- */
  function openHelp() {
    const html = `
      <div class="modal-bd on" id="mdHelp" onclick="if(event.target===this)TV.closeModal('mdHelp')">
        <div class="modal">
          <div class="modal-head">
            <h2>❓ Ayuda de davidTV v3.1</h2>
            <button class="modal-close" onclick="TV.closeModal('mdHelp')">✕</button>
          </div>
          <div class="modal-body">
            <div class="set-group">
              <h3>Atajos de teclado</h3>
              <div class="set-row"><span class="label">Cambiar canal</span><b>↑ / ↓</b></div>
              <div class="set-row"><span class="label">Volumen</span><b>← / →</b></div>
              <div class="set-row"><span class="label">Silenciar</span><b>M</b></div>
              <div class="set-row"><span class="label">Info</span><b>I</b></div>
              <div class="set-row"><span class="label">Favorito</span><b>F</b></div>
              <div class="set-row"><span class="label">Grabar</span><b>R</b></div>
              <div class="set-row"><span class="label">Guía</span><b>G</b></div>
              <div class="set-row"><span class="label">Multi-view</span><b>4</b></div>
              <div class="set-row"><span class="label">PiP</span><b>P</b></div>
              <div class="set-row"><span class="label">Canal directo</span><b>1-9</b></div>
            </div>
            <div class="set-group">
              <h3>Novedades v3.1</h3>
              <div style="padding:12px 16px;font-size:13px;line-height:1.7;color:var(--dim);">
                ✅ Corregidos bugs de volumen y navegación<br>
                ✅ <b>YouTube</b> integrado con 24 vídeos y búsqueda<br>
                ✅ <b>davidTV STORE</b> con ${STORE_APPS.length} apps instalables<br>
                ✅ 3 vistas principales: TV · YouTube · Tienda<br>
                ✅ Todo persiste en localStorage
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
  }

  /* ---------- FULLSCREEN ---------- */
  function toggleFull() {
    state.fullscreen = !state.fullscreen;
    const app = $('#app');
    if (app) app.classList.toggle('fullscreen', state.fullscreen);
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(()=>{});
    notify(state.fullscreen ? '⛶ Pantalla completa' : 'Saliendo');
  }

  /* ---------- SEARCH ---------- */
  function setupSearch() {
    const input = $('#search');
    if (!input) return;
    input.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (state.view === 'youtube') {
        state.ytSearch = q;
        renderYtGrid();
        return;
      }
      if (state.view === 'store') {
        state.storeSearch = q;
        renderStoreGrid();
        return;
      }
      if (!q) { renderChannels(); return; }
      const list = CHANNELS.filter(c =>
        c.name.toLowerCase().includes(q) ||
        c.cat.toLowerCase().includes(q) ||
        c.now.toLowerCase().includes(q) ||
        String(c.n) === q
      );
      renderSearchList(list);
    });
  }

  function renderSearchList(list) {
    const host = $('#chList');
    if (!host) return;
    setText('chListTitle', `Resultados (${list.length})`);
    if (!list.length) { host.innerHTML = '<div style="padding:20px;text-align:center;color:var(--dim);font-size:12px;">Sin resultados</div>'; return; }
    host.innerHTML = list.map(ch => `
      <div class="ch-item ${state.current===ch.n?'on':''}" onclick="TV.tune(${ch.n})">
        <span class="ch-num">${ch.n}</span>
        <span class="ch-ico" style="background:${ch.color};">${ch.icon}</span>
        <span class="ch-info">
          <span class="ch-name">${esc(ch.name)}</span>
          <span class="ch-prog">${esc(ch.cat)} · ${esc(ch.now)}</span>
        </span>
        <span class="ch-fav" onclick="event.stopPropagation();TV.toggleFav(${ch.n})">${state.favorites.includes(ch.n)?'★':'☆'}</span>
      </div>
    `).join('');
  }

  /* ---------- CLOCK ---------- */
  function updateClock() {
    const d = new Date();
    setText('clockT', d.getHours() + ':' + pad(d.getMinutes()));
    setText('clockD', d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }));
  }
  function updateWatchTime() {
    const total = state.watchSeconds + (Date.now() - state.watchStart) / 1000;
    const m = Math.floor(total / 60);
    setText('watchTime', m + 'm');
    if (m >= 60) unlockAch('hours');
  }

  /* ---------- KEYBOARD ---------- */
  function setupKeyboard() {
    document.addEventListener('keydown', e => {
      if (e.target.matches('input,select,textarea')) return;
      // Cerrar modales con Escape
      if (e.key === 'Escape') { $$('.modal-bd').forEach(m => m.remove()); return; }
      // Si no estamos en la vista TV, no procesamos los atajos de canal
      if (state.view !== 'tv') return;
      const k = e.key;
      if (k === 'ArrowUp') { e.preventDefault(); prevChannel(); showInfo(); }
      else if (k === 'ArrowDown') { e.preventDefault(); nextChannel(); showInfo(); }
      else if (k === 'ArrowLeft') { e.preventDefault(); volDown(); }
      else if (k === 'ArrowRight') { e.preventDefault(); volUp(); }
      else if (k === 'm' || k === 'M') toggleMute();
      else if (k === 'i' || k === 'I') showInfo();
      else if (k === 'f' || k === 'F') toggleFavCurrent();
      else if (k === 'r' || k === 'R') toggleRec();
      else if (k === 'g' || k === 'G') openEpg();
      else if (k === 'p' || k === 'P') togglePip();
      else if (k === '4') openMulti();
      else if (/^[0-9]$/.test(k)) {
        numBuffer += k;
        clearTimeout(numTimer);
        numTimer = setTimeout(() => {
          if (numBuffer) { tune(parseInt(numBuffer)); numBuffer = ''; }
        }, 1000);
        showInfo();
      }
    });
  }

  /* ---------- INIT (BUG FIX: robusto) ---------- */
  function init() {
    try {
      document.documentElement.setAttribute('data-theme', state.theme);
      setText('profileName', state.profile);
      setText('signalLbl', '4K');
      setText('remoteBatt', '100%');

      renderCategories();
      renderChannels();
      renderScreen();
      updateClock();
      updateWatchTime();

      // Botones principales
      const bind = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
      bind('btnRemote', toggleRemote);
      bind('btnMulti', openMulti);
      bind('btnPip', togglePip);
      bind('btnRec', toggleRec);
      bind('btnFull', toggleFull);
      bind('btnSettings', openSettings);
      bind('btnHelp', openHelp);
      bind('btnTheme', toggleTheme);

      bind('btnSort', () => {
        const modes = ['num','name','cat'];
        const i = modes.indexOf(state.sort);
        state.sort = modes[(i+1)%3];
        notify('Orden: ' + state.sort);
        renderChannels();
      });
      bind('btnFavFilter', () => {
        state.filter = state.filter === 'fav' ? 'all' : 'fav';
        renderChannels();
        notify('Filtro: ' + (state.filter === 'fav' ? 'Favoritos' : 'Todos'));
      });
      bind('btnRecentFilter', () => {
        state.filter = state.filter === 'recent' ? 'all' : 'recent';
        renderChannels();
        notify('Filtro: ' + (state.filter === 'recent' ? 'Recientes' : 'Todos'));
      });

      setupSearch();
      setupKeyboard();

      // Volumen inicial (null-safe ahora)
      setVolume(state.volume);
      updateRemoteNow();

      // Intervalos
      setInterval(updateClock, 1000);
      setInterval(updateWatchTime, 5000);
      setInterval(() => { if (state.view === 'tv') renderScreen(); }, 30000);
      setInterval(updateTicker, 45000);

      // Sesiones
      state.totalSessions = (state.totalSessions || 0) + 1;
      saveState();

      setTimeout(() => notify('📺 davidTV v3.1 · 90 canales + YouTube + STORE', 'success'), 500);
      setTimeout(() => showInfo(), 900);

      console.log('%c davidTV v3.1 lista · TV.switchTab("youtube") para probar YouTube', 'background:#0078d4;color:#fff;padding:4px 10px;border-radius:5px;font-weight:bold;');
    } catch (err) {
      console.error('[davidTV] init error:', err);
    }
  }

  /* ---------- PUBLIC API ---------- */
  return {
    state,
    init,
    tune, nextChannel, prevChannel, setCat, toggleFav, toggleFavCurrent,
    setVolume, volUp, volDown, toggleMute,
    showInfo, showView, switchTab,
    toggleRemote, toggleRec, openRecs, deleteRec,
    openEpg, openFavs, openSettings, openHelp, openTrending, openAchievements, openStats,
    openMulti, multiSwitch, multiSelect,
    togglePip, closePip, renderPip,
    toggleFull, toggleTheme, setTheme, toggleSetting, toggleKids, changePin, setSleep, setProfile, resetAll,
    setAudio, setQuality,
    closeModal, notify, renderScreen,
    typeNumber,
    // YouTube
    setYtCat, playYt,
    // Store
    setStoreCat, toggleInstall, openStoreApp,
    // Debug
    _renderChannels: renderChannels,
    _renderScreen: renderScreen
  };
})();

// Bug fix: ejecutar init tanto si el DOM ya está listo como si no
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => TV.init());
} else {
  TV.init();
}

// También exponer en window por si acaso
window.TV = TV;
</script>
